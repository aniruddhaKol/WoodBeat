<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Song glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity"><feFuncA type="linear" slope="0.68"/></feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Single musical eighth note; transparent background. -->
  <g filter="url(#shade)" fill="url(#ivory)" stroke="#53290f" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50 22 L78 15 L78 29 L50 36 Z" stroke-width="3"/>
    <path d="M50 29 V70" fill="none" stroke="#53290f" stroke-width="11"/>
    <path d="M50 29 V70" fill="none" stroke="url(#ivory)" stroke-width="7"/>
    <ellipse cx="37" cy="70" rx="15" ry="9.5" transform="rotate(-24 37 70)" stroke-width="3"/>
  </g>
  <path d="M53 25 L75 19" fill="none" stroke="#fff8df" stroke-width="1.8" stroke-linecap="round" opacity="0.82"/>
  <path d="M32 66 C36 62 43 62 46 65" fill="none" stroke="#fff8df" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
</svg>
