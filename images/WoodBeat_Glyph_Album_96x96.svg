<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Album glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity"><feFuncA type="linear" slope="0.68"/></feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Album sleeve with exposed vinyl disc; transparent background. -->
  <g filter="url(#shade)">
    <circle cx="60" cy="48" r="30" fill="url(#ivory)" stroke="#53290f" stroke-width="3"/>
    <circle cx="60" cy="48" r="23" fill="none" stroke="#855126" stroke-width="1.5"/>
    <circle cx="60" cy="48" r="17" fill="none" stroke="#855126" stroke-width="1.4"/>
    <circle cx="60" cy="48" r="8" fill="#53290f" stroke="#fff0ce" stroke-width="2"/>
    <circle cx="60" cy="48" r="2.5" fill="#fff8e6"/>
    <rect x="13" y="19" width="44" height="58" rx="3.2" fill="url(#ivory)" stroke="#53290f" stroke-width="3"/>
  </g>
  <path d="M18 24 H52" fill="none" stroke="#fff8df" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M20 68 H48" fill="none" stroke="#855126" stroke-width="1.4" opacity="0.7"/>
  <path d="M24 42 L47 35 L47 43 L24 50 Z" fill="#a46e35" stroke="#53290f" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24 46 V61" stroke="#53290f" stroke-width="6" stroke-linecap="round"/>
  <path d="M24 46 V61" stroke="url(#ivory)" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="18.5" cy="61.5" rx="7.5" ry="4.4" transform="rotate(-22 18.5 61.5)" fill="url(#ivory)" stroke="#53290f" stroke-width="1.8"/>
</svg>
