<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Repeat all glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity">
        <feFuncA type="linear" slope="0.68"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="opacity"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background; repeat-one numeral is added by app code. -->
  <g filter="url(#shade)" fill="none" stroke="#53290f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 31 H65"/>
    <path d="M72 31 C77 31 80 34 80 39 V48"/>
    <path d="M77 65 H31"/>
    <path d="M24 65 C19 65 16 62 16 57 V48"/>
  </g>
  <g fill="none" stroke="url(#ivory)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 31 H65"/>
    <path d="M72 31 C77 31 80 34 80 39 V48"/>
    <path d="M77 65 H31"/>
    <path d="M24 65 C19 65 16 62 16 57 V48"/>
  </g>

  <g filter="url(#shade)" fill="url(#ivory)" stroke="#53290f" stroke-width="3" stroke-linejoin="round">
    <path d="M61 18 L80 31 L61 44 Z"/>
    <path d="M35 52 L16 65 L35 78 Z"/>
  </g>

  <g fill="none" stroke="#fff8df" stroke-width="1.7" stroke-linecap="round" opacity="0.78">
    <path d="M63.5 22.2 L73.4 30.2"/>
    <path d="M32.4 56.2 L22.6 64.2"/>
    <path d="M22 31 H60"/>
    <path d="M74 65 H36"/>
  </g>
</svg>
