<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Chevron right glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity"><feFuncA type="linear" slope="0.68"/></feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Transparent background. Rotate 90 degrees clockwise in code for a down chevron. -->
  <g filter="url(#shade)" fill="none" stroke="#53290f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 19 L64 48 L35 77"/>
  </g>
  <g fill="none" stroke="url(#ivory)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 19 L64 48 L35 77"/>
  </g>
  <path d="M33.7 19.7 L61.2 48" fill="none" stroke="#fff8df" stroke-width="1.8" stroke-linecap="round" opacity="0.74"/>
</svg>
