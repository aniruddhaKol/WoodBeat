    <path d="M15 67 H26 C46 67 48 30 70 30 H75"/>
  </g>
  <g filter="url(#shade)" fill="url(#ivory)" stroke="#53290f" stroke-width="3" stroke-linejoin="round">
    <path d="M66 17 L81 30 L66 43 Z"/>
    <path d="M66 53 L81 66 L66 79 Z"/>
  </g>
  <g fill="none" stroke="#fff8df" stroke-width="1.7" stroke-linecap="round" opacity="0.78">
