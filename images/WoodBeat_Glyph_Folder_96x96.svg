  </g>
  <g fill="none" stroke="#fff8df" stroke-width="2" stroke-linecap="round" opacity="0.78">
    <path d="M17 24 H37 Q40 24 42 27 L45 30"/>
    <path d="M18 42 H78"/>
  </g>
  <path d="M18 71 H77" stroke="#98622f" stroke-width="1.5" opacity="0.66"/>
</svg>
