<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Folder glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity">
        <feFuncA type="linear" slope="0.68"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Folder tab and broad front face, transparent background. -->
  <g filter="url(#shade)" stroke="#53290f" stroke-width="3.2" stroke-linejoin="round">
    <path d="M11 24 Q11 19 17 19 H38 Q42 19 45 23 L51 29 H79 Q85 29 85 35 V70 Q85 77 78 77 H18 Q11 77 11 70 Z" fill="url(#ivory)"/>
