<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Plus glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity"><feFuncA type="linear" slope="0.68"/></feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Same ivory-gold bevel as the Play glyph; placed on the wooden button (#5). -->
  <path d="M40 18 H56 Q58 18 58 20 V38 H76 Q78 38 78 40 V56 Q78 58 76 58 H58 V76 Q58 78 56 78 H40 Q38 78 38 76 V58 H20 Q18 58 18 56 V40 Q18 38 20 38 H38 V20 Q38 18 40 18 Z"
        fill="url(#ivory)" stroke="#53290f" stroke-width="3.2" stroke-linejoin="round" filter="url(#shade)"/>
  <path d="M41 23 V40 H24" fill="none" stroke="#fff8df" stroke-width="1.9" stroke-linecap="round" opacity="0.72"/>
</svg>
