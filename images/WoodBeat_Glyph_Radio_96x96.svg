<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Radio glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity"><feFuncA type="linear" slope="0.68"/></feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ivory-gold beveled classic radio; transparent background. -->
  <g filter="url(#shade)" stroke="#53290f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 36 L61 12" fill="none" stroke-width="8"/>
    <path d="M22 36 L61 12" fill="none" stroke="url(#ivory)" stroke-width="5"/>
    <rect x="12" y="34" width="72" height="47" rx="8" fill="url(#ivory)" stroke-width="3.5"/>
    <rect x="20" y="42" width="41" height="27" rx="4" fill="#53290f" stroke-width="2.5"/>
    <path d="M26 47 V64 M33 47 V64 M40 47 V64 M47 47 V64 M54 47 V64" fill="none" stroke="url(#ivory)" stroke-width="3.3"/>
    <circle cx="71" cy="53" r="8" fill="#623415" stroke-width="2"/>
    <circle cx="71" cy="53" r="5.5" fill="url(#ivory)" stroke-width="1.6"/>
    <path d="M66 69 H77" fill="none" stroke="#53290f" stroke-width="5"/>
    <path d="M66 69 H77" fill="none" stroke="url(#ivory)" stroke-width="3"/>
  </g>
  <path d="M17 40 H79" fill="none" stroke="#fff8df" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 49 L73 47" fill="none" stroke="#fff8df" stroke-width="1.5" opacity="0.7"/>
</svg>
