<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Artist glyph">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.48" stop-color="#f7dba6"/>
      <stop offset="1" stop-color="#c48a4b"/>
    </linearGradient>
    <filter id="shade" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.4" result="offset"/>
      <feComponentTransfer in="offset" result="opacity">
        <feFuncA type="linear" slope="0.68"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="opacity"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Person / performing artist with vintage microphone, transparent background. -->
  <g filter="url(#shade)" stroke="#53290f" stroke-width="3" stroke-linejoin="round">
    <circle cx="39" cy="31" r="15" fill="url(#ivory)"/>
    <path d="M13 79 V71 C13 57 25 51 39 51 C53 51 65 57 65 71 V79 Z" fill="url(#ivory)"/>
    <rect x="69" y="24" width="15" height="25" rx="7.5" fill="url(#ivory)"/>
  </g>
  <g fill="none" stroke="#fff8df" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
    <path d="M32 29 C34 27 37 26 41 27"/>
    <path d="M20 68 C22 62 26 59 32 58"/>
    <path d="M73 29 V39"/>
  </g>
  <g fill="none" stroke="#53290f" stroke-width="4" stroke-linecap="round">
    <path d="M65 40 V47 A11 11 0 0 0 87 47 V40"/>
    <path d="M76 58 V78 M66 78 H86"/>
  </g>
  <g fill="none" stroke="url(#ivory)" stroke-width="2.6" stroke-linecap="round">
    <path d="M65 40 V47 A11 11 0 0 0 87 47 V40"/>
    <path d="M76 58 V78 M66 78 H86"/>
  </g>
</svg>
